services:
  - type: web
    name: data-to-dirt
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 0 "src.app.server:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
